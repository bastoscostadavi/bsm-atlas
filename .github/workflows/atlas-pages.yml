name: Publish BSM Atlas

on:
  push:
    branches: [main]
    paths: ['website/**', 'atlas/**', 'scripts/**', 'Makefile', 'README.md', 'BSM_ATLAS_AGENT_PROMPT.md', '.github/workflows/atlas-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: atlas-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Check static source
        run: |
          python3 -B scripts/check.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: website
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
