name: Publish BSM Atlas

on:
  push:
    branches: [main]
    paths: ['website/**', 'atlas/**', 'BSM_ATLAS_SEED.md', '.github/workflows/atlas-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: atlas-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Check static source
        run: |
          node --check website/app.js
          node --check website/data.js
          node --check website/search.js
          node --check website/catalog.js
          node --check website/field-catalogue.js
          node --check website/field-matrix.js
          node --check website/representation-diagrams.js
          node --check website/field-catalogue-data.js
          PYTHONDONTWRITEBYTECODE=1 python3 website/build_field_catalogue.py --check
          PYTHONDONTWRITEBYTECODE=1 python3 website/test_field_catalogue.py
          PYTHONDONTWRITEBYTECODE=1 python3 website/test_identity.py
          PYTHONDONTWRITEBYTECODE=1 python3 website/test_scalar_conventions.py
          PYTHONDONTWRITEBYTECODE=1 python3 website/test_reextraction_reviews.py
          node website/field-catalogue.test.mjs
          node website/representation-diagrams.test.mjs
          python3 website/build_manifest.py --check
          node website/check.mjs
          node website/search.test.mjs
          node website/catalog.test.mjs
          PYTHONDONTWRITEBYTECODE=1 python3 website/test_export_atlas.py
          PYTHONDONTWRITEBYTECODE=1 python3 website/test_snapshot.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: website
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
